# Render Blueprint for Pinpoint
# Deploys: Go API (primary), Python API (optional), Web Client, Postgres, Redis
# Usage: render.yaml + dashboard env vars (DATABASE_URL from Supabase, SESSION_SECRET)

services:
  # ──────────────────────────────────────────────────────────────
  # Go API — primary backend (default Docker stack)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: pinpoint-go-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: WEB_ROOT
        value: /app/web/public
      - key: DB_DRIVER
        value: postgres
      - key: SEED_DEMO_DATA
        value: "true"
      # Set these in Render Dashboard (not committed):
      # - DATABASE_URL (from Supabase)
      # - REDIS_URL (from Render Redis or Upstash)
      # - SESSION_SECRET (generate: openssl rand -base64 32)
      # - CSP_TILE_HOST (your tile host, e.g. maps.wikimedia.org)

  # ──────────────────────────────────────────────────────────────
  # Python API — alternate backend (FastAPI)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: pinpoint-python-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.python
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false  # enable if you want both
    envVars:
      - key: PORT
        value: "8001"
      - key: WEB_ROOT
        value: /app/web
      - key: DB_DRIVER
        value: postgres
      - key: SEED_DEMO_DATA
        value: "true"
      # Same secrets as Go API, set in Dashboard

  # ──────────────────────────────────────────────────────────────
  # Web Client (Go stack) — static site from web/public
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: pinpoint-web
    env: static
    buildCommand: "echo 'Static site - no build needed'"
    staticPublishPath: ./web/public
    plan: free
    region: oregon
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pinpoint-go-api.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://pinpoint-go-api.onrender.com/ws/*
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://maps.wikimedia.org; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://pinpoint-go-api.onrender.com wss://pinpoint-go-api.onrender.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

  # ──────────────────────────────────────────────────────────────
  # Redis (free tier on Render) — session cache
  # ──────────────────────────────────────────────────────────────
  - type: redis
    name: pinpoint-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  # ──────────────────────────────────────────────────────────────
  # Use Supabase PostgreSQL instead — do NOT create a Render Postgres
  # ──────────────────────────────────────────────────────────────
