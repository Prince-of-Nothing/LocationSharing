# docker-compose.yml — Pure-Rust modular stack (HA-ready)
#
# Everything is Rust:
#   gateway  → nginx, the CENTRAL directory (see docs/service-discovery.md):
#     routes /api/v1/auth, /api/v1/users, /api/v1/locations, /map and picks
#     ANY healthy replica via per-request Docker-DNS + proxy_next_upstream
#     retries. Live registry: GET /registry. X-Upstream shows the replica.
#   auth     → pinpoint-auth (src/bin/auth.rs, internal :8001)
#   users    → pinpoint-users (src/bin/users.rs, internal :8002)
#   locations→ pinpoint-locations (src/bin/locations.rs, internal :8003)
#   map      → pinpoint-map (src/bin/map.rs, internal :8004, stateless)
#   db       → Postgres 16 (single primary; dumps every 5 min to pinpoint-backups)
#   db-backup→ pg_dump loop (point-in-time recovery if the primary dies)
#   client   → desktop GUI image (profile "client", Linux X11 host only)
#
# Redundancy: each service runs `scale: 2` replicas by default
# (honoured by `docker compose up`; Swarm uses `deploy.replicas`).
# Kill one replica and requests keep working via the surviving one:
#   docker compose ps
#   docker compose up --scale auth=3 --scale locations=2
# Clients only ever talk to the gateway (:8000/:8443); direct service
# ports are intentionally NOT published so replicas don't collide on host
# ports. Debug a single replica with:
#   docker compose run --rm --no-deps -p 8001:8001 auth
#
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   Invoke-RestMethod http://127.0.0.1:8000/health
#
# NOTE: Postgres stays a single primary (connected-DB by design). Full DB
# HA (streaming replica / Patroni) is the production step beyond this
# file — see docs/redundancy.md. The pg_dump backup here covers
# point-in-time recovery; the service replicas cover process failure.

services:
  ###########################################################################
  # db — Postgres 16 with persistent storage
  ###########################################################################
  db:
    image: postgres:16-alpine
    container_name: pinpoint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinpoint
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: pinpoint-local-dev
      AUTH_DB_PWD: ${AUTH_DB_PWD:-pinpoint-auth-dev}
      USERS_DB_PWD: ${USERS_DB_PWD:-pinpoint-users-dev}
      LOCATIONS_DB_PWD: ${LOCATIONS_DB_PWD:-pinpoint-locations-dev}
    volumes:
      - pinpoint-db-data:/var/lib/postgresql/data
      # Per-service least-privilege roles (db/init/01-roles.sh runs once).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinpoint -d pinpoint"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pinpoint-net
    ports:
      - "5432:5432"

  ###########################################################################
  # db-backup — periodic pg_dump (point-in-time recovery)
  ###########################################################################
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "pinpoint db-backup: pg_dump every 300s (keep last 24)";
        while true; do
          ts=$$(date +%Y%m%dT%H%M%S);
          pg_dump -h db -U pinpoint -d pinpoint -f /backups/pinpoint-$$ts.sql && echo "backup $$ts ok";
          ls -1t /backups/*.sql 2>/dev/null | tail -n +25 | xargs -r rm -f;
          sleep 300;
        done
    environment:
      PGPASSWORD: pinpoint-local-dev
    volumes:
      - pinpoint-backups:/backups
    networks:
      - pinpoint-net

  ###########################################################################
  # auth — Rust auth service (login/register/session), 2 replicas
  ###########################################################################
  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-auth
    image: pinpoint:pinpoint-auth
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      BIND_ADDR: 0.0.0.0:8001
      INTERNAL_PORT: "8001"
      DATABASE_URL: postgresql://pinpoint_auth:${AUTH_DB_PWD:-pinpoint-auth-dev}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8001"

  ###########################################################################
  # users — Rust users + friendships service, 2 replicas
  ###########################################################################
  users:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-users
    image: pinpoint:pinpoint-users
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      BIND_ADDR: 0.0.0.0:8002
      INTERNAL_PORT: "8002"
      DATABASE_URL: postgresql://pinpoint_users:${USERS_DB_PWD:-pinpoint-users-dev}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8002"

  ###########################################################################
  # locations — Rust locations + shares service, 2 replicas
  ###########################################################################
  locations:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-locations
    image: pinpoint:pinpoint-locations
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      BIND_ADDR: 0.0.0.0:8003
      INTERNAL_PORT: "8003"
      DATABASE_URL: postgresql://pinpoint_locations:${LOCATIONS_DB_PWD:-pinpoint-locations-dev}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8003"

  ###########################################################################
  # map — Rust map service (tiles proxy + attribution + health, OSM ODbL)
  # Stateless — the safest service to scale; tile cache is per-process.
  ###########################################################################
  map:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-map
    image: pinpoint:pinpoint-map
    restart: unless-stopped
    scale: 2
    deploy:
      replicas: 2
    environment:
      BIND_ADDR: 0.0.0.0:8004
      INTERNAL_PORT: "8004"
      # Free CARTO Basemaps key (https://carto.com/basemaps/apikey) — required
      # for tile proxy live 200s since CARTO gates keyless access.
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/map/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pinpoint-net
    expose:
      - "8004"

  ###########################################################################
  # gateway — nginx reverse proxy (single entrypoint for clients)
  # Single container today; `restart: unless-stopped` covers crash recovery.
  # Two gateways behind your own LB is the production step (published port
  # can't be shared) — see docs/redundancy.md.
  ###########################################################################
  gateway:
    image: nginx:1.27-alpine
    container_name: pinpoint-gateway
    restart: unless-stopped
    volumes:
      # HTTP dev profile (default). HTTPS profile: use -f docker-compose.https.yml
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      locations:
        condition: service_healthy
      map:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pinpoint-net
    ports:
      - "8000:80"
      - "8443:443"

  ###########################################################################
  # client — Rust desktop GUI (profile "client", Linux X11 host only)
  # Usage: docker compose --profile client run --rm client
  ###########################################################################
  client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile.client
      target: runtime
    image: pinpoint-desktop:latest
    container_name: pinpoint-client
    environment:
      - PINPOINT_BACKEND=http://host.docker.internal:8000
      - PINPOINT_DATA_DIR=/home/pinpoint/.pinpoint
      - DISPLAY=${DISPLAY:-:0}
    user: "1000:1000"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - pinpoint-data:/home/pinpoint/.pinpoint
    networks:
      - pinpoint-net

networks:
  pinpoint-net:
    driver: bridge

volumes:
  pinpoint-db-data:
    driver: local
  pinpoint-backups:
    driver: local
  pinpoint-data:
    driver: local
