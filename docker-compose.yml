# docker-compose.yml — Pure-Rust modular stack
#
# Everything is Rust:
#   gateway  → nginx reverse proxy (routes /api/v1/auth, /api/v1/users, ...)
#   auth     → pinpoint-auth (src/bin/auth.rs, port 8001)
#   users    → pinpoint-users (src/bin/users.rs, port 8002)
#   locations→ pinpoint-locations (src/bin/locations.rs, port 8003)
#   map      → pinpoint-map (src/bin/map.rs, port 8004)
#   db       → Postgres 16 (persistence via JSONB snapshot in pinpoint_state)
#   client   → desktop GUI image (profile "client", Linux X11 host only)
#
# Scale any service independently:
#   docker compose up --scale auth=3 --scale locations=2
#
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   Invoke-RestMethod http://127.0.0.1:8000/health

services:
  ###########################################################################
  # db — Postgres 16 with persistent storage
  ###########################################################################
  db:
    image: postgres:16-alpine
    container_name: pinpoint-db
    environment:
      POSTGRES_DB: pinpoint
      POSTGRES_USER: pinpoint
      POSTGRES_PASSWORD: pinpoint-local-dev
      AUTH_DB_PWD: ${AUTH_DB_PWD:-pinpoint-auth-dev}
      USERS_DB_PWD: ${USERS_DB_PWD:-pinpoint-users-dev}
      LOCATIONS_DB_PWD: ${LOCATIONS_DB_PWD:-pinpoint-locations-dev}
    volumes:
      - pinpoint-db-data:/var/lib/postgresql/data
      # Per-service least-privilege roles (db/init/01-roles.sh runs once).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinpoint -d pinpoint"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pinpoint-net
    ports:
      - "5432:5432"

  ###########################################################################
  # auth — Rust auth service (login/register/session)
  ###########################################################################
  auth:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-auth
    image: pinpoint:pinpoint-auth
    container_name: pinpoint-auth
    environment:
      BIND_ADDR: 0.0.0.0:8001
      DATABASE_URL: postgresql://pinpoint_auth:${AUTH_DB_PWD:-pinpoint-auth-dev}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pinpoint-net
    ports:
      - "8001:8001"

  ###########################################################################
  # users — Rust users + friendships service
  ###########################################################################
  users:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-users
    image: pinpoint:pinpoint-users
    container_name: pinpoint-users
    environment:
      BIND_ADDR: 0.0.0.0:8002
      DATABASE_URL: postgresql://pinpoint_users:${USERS_DB_PWD:-pinpoint-users-dev}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pinpoint-net
    ports:
      - "8002:8002"

  ###########################################################################
  # locations — Rust locations + shares service
  ###########################################################################
  locations:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-locations
    image: pinpoint:pinpoint-locations
    container_name: pinpoint-locations
    environment:
      BIND_ADDR: 0.0.0.0:8003
      DATABASE_URL: postgresql://pinpoint_locations:${LOCATIONS_DB_PWD:-pinpoint-locations-dev}@db:5432/pinpoint
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pinpoint-net
    ports:
      - "8003:8003"

  ###########################################################################
  # map — Rust map service (tiles proxy + attribution + health, OSM ODbL)
  ###########################################################################
  map:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        BIN: pinpoint-map
    image: pinpoint:pinpoint-map
    container_name: pinpoint-map
    environment:
      BIND_ADDR: 0.0.0.0:8004
      # Free CARTO Basemaps key (https://carto.com/basemaps/apikey) — required
      # for tile proxy live 200s since CARTO gates keyless access.
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    networks:
      - pinpoint-net
    ports:
      - "8004:8004"

  ###########################################################################
  # gateway — nginx reverse proxy (single entrypoint for clients)
  ###########################################################################
  gateway:
    image: nginx:1.27-alpine
    container_name: pinpoint-gateway
    volumes:
      # HTTP dev profile (default). HTTPS profile: use -f docker-compose.https.yml
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - users
      - locations
      - map
    networks:
      - pinpoint-net
    ports:
      - "8000:80"
      - "8443:443"

  ###########################################################################
  # client — Rust desktop GUI (profile "client", Linux X11 host only)
  # Usage: docker compose --profile client run --rm client
  ###########################################################################
  client:
    profiles: ["client"]
    build:
      context: .
      dockerfile: Dockerfile.client
      target: runtime
    image: pinpoint-desktop:latest
    container_name: pinpoint-client
    environment:
      - PINPOINT_BACKEND=http://host.docker.internal:8000
      - PINPOINT_DATA_DIR=/home/pinpoint/.pinpoint
      - DISPLAY=${DISPLAY:-:0}
    user: "1000:1000"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - pinpoint-data:/home/pinpoint/.pinpoint
    networks:
      - pinpoint-net

networks:
  pinpoint-net:
    driver: bridge

volumes:
  pinpoint-db-data:
    driver: local
  pinpoint-data:
    driver: local
