name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Rust multiplatform client (root crate): format, lints, locked build,
    # unit + API-contract tests, and a dependency audit.
    # Includes desktop/mobile-shared core and web app bins (web/weba/webk stubs).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system dependencies (egui/winit link, reqwest TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (locked)
        run: cargo build --locked
      - name: Build web app bins (native stubs)
        run: cargo build --locked --bin pinpoint-web --bin pinpoint-weba --bin pinpoint-webk
      - name: Tests (locked) — unit + API contract
        run: cargo test --locked
      - name: Dependency vulnerability audit (cargo-audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  wasm:
    # Compile-check web clients for wasm32 (Trunk entry bins + wasm cfg paths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      - name: Check web bins for wasm32
        run: |
          cargo check --locked --target wasm32-unknown-unknown \
            --bin pinpoint-web --bin pinpoint-weba --bin pinpoint-webk

  client-macos:
    # macOS desktop build — same `src/` as Linux/Windows via eframe.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked) — unit + API contract
        run: cargo test --locked
      - name: Build web app bins (native stubs)
        run: cargo build --locked --bin pinpoint-web --bin pinpoint-weba --bin pinpoint-webk
      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-desktop-macos
          path: target/release/pinpoint-desktop
          if-no-files-found: warn

  release-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --locked --bin pinpoint-desktop
      - name: Package artifact
        shell: pwsh
        run: |
          $zipPath = "pinpoint-desktop-windows.zip"
          $exePath = "target/release/pinpoint-desktop.exe"
          if (-not (Test-Path $exePath)) { throw "Missing binary: $exePath" }
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-desktop-windows
          path: pinpoint-desktop-windows.zip
          if-no-files-found: error
