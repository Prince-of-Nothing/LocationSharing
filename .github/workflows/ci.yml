name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # Rust multiplatform client (root crate): format, lints, locked build,
    # unit + API-contract tests, and a dependency audit.
    # The archived Go/Python/web/Kotlin stacks no longer build (ADR-0007);
    # this is the sole application gate.
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings as a check-run via the
    # Checks API; the workflow-wide `contents: read` default leaves the
    # token without `checks: write`, which makes the action fail with
    # "Resource not accessible by integration" before it can report.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (egui/winit link, reqwest TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev
      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked) — unit + API contract
        run: cargo test --locked
      - name: Dependency vulnerability audit (cargo-audit)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  client-macos:
    # macBook desktop build — same `src/` as Linux/Windows via eframe.
    # No X11 deps needed (macOS window server owns them); GUI run still
    # needs a human first-run (see docs/client-platforms.md).
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (locked)
        run: cargo build --locked
      - name: Tests (locked) — unit + API contract
        run: cargo test --locked
      - name: Web stub builds on macOS
        run: cargo build --locked --bin pinpoint-web
      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-desktop-macos
          path: target/release/pinpoint-desktop

  release:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package artifact
        shell: pwsh
        run: |
          $zipPath = "pinpoint-desktop.zip"
          $exePath = "target\x86_64-pc-windows-msvc/release/pinpoint-desktop.exe"
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpoint-desktop
          path: pinpoint-desktop.zip
