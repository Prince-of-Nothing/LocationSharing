name: Map QA (Rust OSM compliance)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  map-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSM tile policy (never tile.openstreetmap.org tile URLs)
        run: |
          if grep -R --include='*.rs' -n 'tile\.openstreetmap\.org/' src/ tests/ 2>/dev/null | grep -v -i -E 'never|prohibit|must not|do not|policy|usage' | grep -q .; then
            echo "FAIL: tile.openstreetmap.org tile URL in Rust code"
            exit 1
          fi
          echo "OK: no tile.openstreetmap.org tile URLs"
      - name: OSM attribution present
        run: |
          grep -q 'openstreetmap.org/copyright' src/map.rs && echo "OK: map attribution" || { echo "FAIL: missing ODbL attribution"; exit 1; }
          grep -q 'OpenStreetMap contributors' docs/sdlc/07-openstreetmap-integration.md && echo "OK: docs attribution" || { echo "FAIL: missing docs attribution"; exit 1; }
      - name: SDLC + UML set present (Rust-multiplatform docs)
        run: |
          test -f docs/sdlc/README.md && test -f docs/sdlc/07-openstreetmap-integration.md && test -f docs/uml/12-sequence-map-search.md && echo "OK: docs present"
