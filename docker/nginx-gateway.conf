# nginx gateway (HTTP, dev default) — routes clients to modular Rust services.
server {
    listen 80;
    server_name _;

    # ZAP baseline hardening (Z-1/Z-3/Z-5): headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    # Auth service
    location /api/v1/auth/ {
        proxy_pass http://auth:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Users + friendships
    location /api/v1/users/ {
        proxy_pass http://users:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/friendships/ {
        proxy_pass http://users:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Locations + shares
    location /api/v1/locations/ {
        proxy_pass http://locations:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Map service (tiles/attribution/health)
    location /map/ {
        proxy_pass http://map:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 200 '{"status":"healthy","gateway":"pinpoint-gateway"}';
    }

    location / {
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 200 '{"name":"Pinpoint API Gateway","version":"0.1.0","services":["auth","users","locations","map","db"]}';
    }
}
