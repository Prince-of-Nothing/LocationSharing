# nginx gateway (HTTP, dev default) — routes clients to modular Rust services.
# Redundancy: upstreams are resolved per-request via the Docker DNS stub
# (127.0.0.11) and `proxy_next_upstream` retries the next replica on
# connection errors / 502-504, so one failed replica is invisible to clients.
# Tune replica count with the owning service (`scale` / `deploy.replicas`).
server {
    listen 80;
    server_name _;

    # ZAP baseline hardening (Z-1/Z-3/Z-5): headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Auth service
    location /api/v1/auth/ {
        set $auth_upstream http://auth:8001;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Users + friendships
    location /api/v1/users/ {
        set $users_upstream http://users:8002;
        proxy_pass $users_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
    location /api/v1/friendships/ {
        set $users_upstream http://users:8002;
        proxy_pass $users_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Locations + shares
    location /api/v1/locations/ {
        set $locations_upstream http://locations:8003;
        proxy_pass $locations_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Map service (tiles/attribution/health)
    location /map/ {
        set $map_upstream http://map:8004;
        proxy_pass $map_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 200 '{"status":"healthy","gateway":"pinpoint-gateway"}';
    }

    location / {
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 200 '{"name":"Pinpoint API Gateway","version":"0.1.0","services":["auth","users","locations","map","db"]}';
    }
}
