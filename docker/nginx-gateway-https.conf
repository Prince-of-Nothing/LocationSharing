# nginx gateway — HTTPS profile (self-signed, dev/testing only).
# Same central directory as docker/nginx-gateway.conf: gateway picks ANY
# healthy replica (per-request Docker DNS + proxy_next_upstream retries).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/v1/auth/ {
        set $auth_upstream http://auth:8001;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
    location /api/v1/users/ {
        set $users_upstream http://users:8002;
        proxy_pass $users_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
    location /api/v1/friendships/ {
        set $users_upstream http://users:8002;
        proxy_pass $users_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
    location /api/v1/locations/ {
        set $locations_upstream http://locations:8003;
        proxy_pass $locations_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
    location /map/tiles/ {
        set $map_upstream http://map:8004;
        proxy_pass $map_upstream;
        proxy_set_header Host $host;
        expires 1h;
        add_header X-Data-Attribution "© OpenStreetMap contributors";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
    location /map/ {
        set $map_upstream http://map:8004;
        proxy_pass $map_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-Upstream $upstream_addr always;
    }
    location = /registry {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"gateway":"pinpoint-gateway","services":[{"name":"auth","upstream":"auth:8001","path":"/api/v1/auth/"},{"name":"users","upstream":"users:8002","path":"/api/v1/users/,/api/v1/friendships/"},{"name":"locations","upstream":"locations:8003","path":"/api/v1/locations/"},{"name":"map","upstream":"map:8004","path":"/map/"}],"tls":"self-signed"}';
    }
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","gateway":"pinpoint-gateway","tls":"on","tls_mode":"self-signed"}';
    }
    location / {
        add_header Content-Type application/json;
        return 200 '{"name":"Pinpoint API Gateway","version":"0.1.0","services":["auth","users","locations","map","db"],"tls":"self-signed"}';
    }
}
