# nginx gateway — HTTP (dev) + HTTPS (self-signed, optional)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    location /api/v1/auth/ {
        proxy_pass http://auth:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/users/ {
        proxy_pass http://users:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/friendships/ {
        proxy_pass http://users:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/locations/ {
        proxy_pass http://locations:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /map/tiles/ {
        proxy_pass http://map:8004;
        proxy_set_header Host $host;
        expires 1h;
        add_header X-Data-Attribution "© OpenStreetMap contributors";
    }
    location /map/ {
        proxy_pass http://map:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","gateway":"pinpoint-gateway","tls":"on","tls_mode":"self-signed"}';
    }
    location / {
        add_header Content-Type application/json;
        return 200 '{"name":"Pinpoint API Gateway","version":"0.1.0","services":["auth","users","locations","map","db"],"tls":"self-signed"}';
    }
}
