# docker-compose.yml — Pinpoint Rust multiplatform client
#
# Usage:
#   docker compose up --build        # build the client image
#   docker compose run --rm pinpoint # run the desktop client (needs X11/Wayland)
#   docker compose run --rm tester   # run the full CI gate (fmt/clippy/build/test)
#
# The client is a GUI application (eframe/egui). To display it from a Linux
# host, forward the X11 socket:
#   docker compose run --rm -e DISPLAY=$DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix pinpoint
#
# On Windows/macOS Docker Desktop, GUI forwarding is not automatic; use the
# tester service for CI validation or run the binary natively.

services:
  ###########################################################################
  # pinpoint — the Rust desktop client built from source.
  ###########################################################################
  pinpoint:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pinpoint-desktop:latest
    container_name: pinpoint-client
    environment:
      - PINPOINT_BACKEND=http://host.docker.internal:8000
      - PINPOINT_DATA_DIR=/home/pinpoint/.pinpoint
    user: "1000:1000"
    # Uncomment to forward X11 for an interactive desktop session (Linux host):
    # environment:
    #   - DISPLAY=${DISPLAY:-:0}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
    #   - $XAUTHORITY:$XAUTHORITY:ro
    #   - ~/.pinpoint:/home/pinpoint/.pinpoint:rw
    # cap_add:
    #   - NET_BIND_SERVICE
    # stdin_open: true
    # tty: true
    networks:
      - pinpoint-net

  ###########################################################################
  # tester — run the complete Rust CI gate inside a container.
  # Equivalent to: cargo fmt --check && clippy -D warnings && build && test
  ###########################################################################
  tester:
    build:
      context: .
      dockerfile: Dockerfile
      target: tester
    image: pinpoint-desktop:tester
    container_name: pinpoint-tester
    environment:
      - CARGO_NET_OFFLINE=false
    networks:
      - pinpoint-net
    # tester is a one-off job; it exits with the cargo test status code.
    # Use: docker compose up tester   (or docker compose run --rm tester)

  ###########################################################################
  # mock-api — optional stand-in for the Go/Python API during development.
  # Returns minimal JSON envelopes that the Rust client expects. Not a
  # replacement for the real backend; useful for offline client work.
  ###########################################################################
  mock-api:
    image: python:3.11-slim
    container_name: pinpoint-mock-api
    working_dir: /app
    command: >
      sh -c "pip install flask --quiet && python -m flask --app mock_api run --host=0.0.0.0 --port=8000"
    volumes:
      - ./docker/mock-api:/app
    ports:
      - "8000:8000"
    networks:
      - pinpoint-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  pinpoint-net:
    driver: bridge

volumes:
  pinpoint-data:
    driver: local
