[package]
name = "gidireads-rebuild"
version = "0.1.0"
edition = "2021"
description = "Static rebuild of GidiReads website in Rust"
license = "MIT"

[[bin]]
name = "build-site"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itertools = "0.12"