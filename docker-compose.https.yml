# HTTPS gateway override (self-signed, dev/testing only).
# Usage: ./docker/gen-certs.sh && docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
services:
  gateway:
    volumes:
      - ./docker/nginx-gateway-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"
